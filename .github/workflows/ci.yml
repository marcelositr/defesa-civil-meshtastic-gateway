name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install requests

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run local tests
        run: |
          python tests/teste_deduplicacao.py
          python tests/teste_update_cancel.py
          python tests/teste_update_fora.py
          python tests/teste_expiracao.py
          python tests/teste_mensagem_campos.py
          python tests/teste_retencao_estado.py
